<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legendas da Ge</title>
<meta name="theme-color" content="#e85d75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Legendas">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #fdf6f7; --card: #ffffff; --ink: #2b2226; --muted: #85767c; --line: #f0dfe3;
  --accent: #e85d75; --accent-soft: #fde4e9; --ok: #2f9e6e; --ok-soft: #dff5ea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1618; --card: #261f22; --ink: #f6eef0; --muted: #b19fa6; --line: #3a2f33;
          --accent: #ff7d93; --accent-soft: #3d2229; --ok: #5bd39b; --ok-soft: #1f3a2d; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 24px; letter-spacing: -0.3px; }
.sub { margin: 2px 0 12px; color: var(--muted); font-size: 15px; }
#busca { width: 100%; padding: 13px 14px; font-size: 17px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
#busca:focus { border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 9px 15px; border-radius: 999px; font-size: 15px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
main { padding: 6px 16px calc(env(safe-area-inset-bottom) + 90px); max-width: 720px; margin: 0 auto; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 4px 8px; }
.card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); border-radius: 18px; padding: 15px 16px; margin: 0 0 10px; cursor: pointer;
  transition: background .2s, border-color .2s; font: inherit; }
.card:active { transform: scale(.99); }
.card .top { display: flex; align-items: center; gap: 10px; }
.card .nome { flex: 1; font-weight: 700; font-size: 17px; }
.card .copiar { flex: none; font-size: 14px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 6px 11px; border-radius: 999px; }
.card .texto { margin-top: 8px; color: var(--muted); font-size: 15px; white-space: pre-wrap; word-break: break-word; }
.card.ok { background: var(--ok-soft); border-color: var(--ok); }
.card.ok .copiar { background: var(--ok); color: #fff; }
.vazio { text-align: center; color: var(--muted); padding: 40px 10px; }
footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 26px; }
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%) translateY(30px);
  background: var(--ok); color: #fff; font-weight: 700; padding: 13px 22px; border-radius: 999px;
  opacity: 0; transition: .25s; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.erro { background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Legendas da Ge 📝</h1>
  <p class="sub">Toque no produto e a legenda é copiada, com as hashtags.</p>
  <input id="busca" type="search" placeholder="Buscar produto…" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<main id="lista"></main>
<div id="toast" role="status" aria-live="polite">Copiado ✅</div>
<script>
const DADOS = [{"secao": "Na grade", "produto": "CAMISETA HERING", "legenda": "🤍 Camiseta Brasil Feminina Manga Curta Hering #lookfeminino #roupafeminina #camiseta #hering #basico"}, {"secao": "Na grade", "produto": "BODY CLÉA STORE", "legenda": "🤍 Body Regata Second Skin Duplo Poliamida Cléa Store #lookfeminino #roupafeminina #body #bodyfeminino #modafeminina"}, {"secao": "Na grade", "produto": "🤎 KIT 2 BLUSA POLO CANELADA (bege · marrom · branca · rosa)", "legenda": "🤎 Kit 2 Blusa Polo Feminina Justa Canelada Conforto e Estilo\n#lookfeminino #roupafeminina #blusa #polofeminina #polo"}, {"secao": "Na grade", "produto": "👡 RASTEIRINHA PRETA", "legenda": "🤍 Sandália Rasteirinha Feminina Adulto Modinha Delicada Lançamento 34 ao 40\n#lookfeminino #roupafeminina #sandalia #rasteirinha #sandaliafeminina"}, {"secao": "Na grade", "produto": "POLO MASCULINA", "legenda": "✨ KIT 3 Camisas Polo Texturizada Canelada Old Money Masculina Premium. Gola Italiana Slim. Confortável Elegante Não Desbota Não Encolhe Com\nElastano.\n#lookmasculino #modamasculina #camisapolo #camisa #polo"}, {"secao": "Na grade", "produto": "💗 VESTIDO MIDI RIBANA (pink · preto · vermelho)", "legenda": "💗 Vestido Midi de Alça em Ribana com Fenda Lateral\n#lookfeminino #roupafeminina #comprinhas #vestidomidi #vestido"}, {"secao": "Na grade", "produto": "Conjunto short + body", "legenda": "🖤 Conjunto Lili Short Alfaiataria + Body Anarruga Mula Manca #lookfeminino #roupafeminina #short #body #alfaiataria"}, {"secao": "Na grade", "produto": "👕 CAMISETA DAILY INSIDER (Cris)", "legenda": "👕 ✨Camiseta Básica Tech Daily Insider\n#lookmasculino #camiseta #modamasculina #insider #camisetamasculina"}, {"secao": "Na grade", "produto": "👕 CAMISETA HEAVY SLIM INSIDER (Cris)", "legenda": "👕 ✨Tech T-shirt Insider Heavy Slim Masculino\n#lookmasculino #camiseta #modamasculina #insider #camisetamasculina"}, {"secao": "Na grade", "produto": "👖 CALÇA SOCIAL (preta · marrom · branca)", "legenda": "👖 Calça social feminina elegante e confortável\n#lookfeminino #roupafeminina #comprinhas #calca #pantalona"}, {"secao": "Na grade", "produto": "🖤 VESTIDO LONGO DE POÁ (creme · preto · vinho · marrom; branco na grade, sem foto base)", "legenda": "🖤 Vestido Mid Poá Levemente Acetinado\n#lookfeminino #roupafeminina #vestido #vestidolongo #poa"}, {"secao": "Na grade", "produto": "CALÇA RIACHUELO", "legenda": "✨ Calça Pool Jeans barrel cintura média feminina  - Loja Riachuelo oficial \n#lookfeminino #modafeminina #calcajeans #calça  #riachuelo"}, {"secao": "Na grade", "produto": "🌙 PIJAMA AMERICANO (Baby Doll com botões)", "legenda": "🌙 Baby Doll com botões Pijama Feminino Meia Manga em Malha modelo americano #lookfeminino #roupafeminina #pijama #pijamafeminino #babydoll"}, {"secao": "Na fila", "produto": "🍷 CAMISETA ALGODÃO PERUANO (Pima)", "legenda": "🍷 Camiseta Basica Algodão Pima Peruano\n#lookfeminino #roupafeminina #comprinhas #camiseta #algodaoperuano"}, {"secao": "Na fila", "produto": "🤎 KIT 2 CONJUNTOS OVER + PANTALONA", "legenda": "🤎 Kit com 2 Conjunto modelo blusa Over e calça pantalona feminina\n#lookfeminino #roupafeminina #comprinhas #conjuntofeminino #pantalona"}, {"secao": "Na fila", "produto": "🤎 BLUSA PLISSADA MANGA LONGA (branco · preto · vinho · marrom)", "legenda": "🤎 Blusa Feminina plissada Manga Longa\n#lookfeminino #roupafeminina #comprinhas #blusa #blusinha"}, {"secao": "Na fila", "produto": "🖤 BLUSA SKIN CROPPED INSIDER (preta · nude)", "legenda": "🖤 Blusa Feminina Skin Cropped Insider\n#lookfeminino #roupafeminina #comprinhas #skincropped #insider"}, {"secao": "Na fila", "produto": "🤍 REGATA INSIDER (The Perfect Top)", "legenda": "🤍 Blusa de Alça The Perfect Top - Insider\n#lookfeminino #insider #blusa #regata #modafeminina"}, {"secao": "Fora do diário", "produto": "🤍 BLUSA POÁ (regata gola alta)", "legenda": "✨ Blusa Regata Poá Gola Alta\n#lookfeminino #roupafeminina #blusafeminina #blusadepoa #regata"}, {"secao": "Fora do diário", "produto": "🍑 LEGGING FLARE ARARA", "legenda": "👖 Calça Legging Flare ARARA SPORT\n#lookfeminino #roupafeminina #lookdeacademia #legging #modafitness"}, {"secao": "Fora do diário", "produto": "☀️ BLUSA UV ARARA", "legenda": "☀️ Blusa Proteção UV ARARA BASIC\n#lookdeacademia #roupafeminina #blusa #roupadeacademia #protecaouv"}, {"secao": "Fora do diário", "produto": "🧢 BONÉ", "legenda": "🧢 Boné feminino com abertura traseira para o cabelo #bone #bonefeminino #modafitness #caminhada #creatorsearchinsights"}, {"secao": "Fora do diário", "produto": "🛏️ JOGO DE LENÇOL FLORENCE", "legenda": "🛏️ Jogo de lençol percal 400 fios com 4 peças\n#casa #jogodelencol #roupadecama #lencol #comprinhas"}, {"secao": "Fora do diário", "produto": "👟 TÊNIS", "legenda": "👟 Tênis feminino caminhada\n#lookfeminino #roupafeminina #comprinhas #tenis #tenisfeminino"}, {"secao": "Fora do diário", "produto": "🤍 BODY KIT 3", "legenda": "🤍 Kit 3 Body Alcinha com Sustentação Roupa Feminina Básica\n#lookfeminino #roupafeminina #comprinhas #body #achadinhos"}, {"secao": "Reserva", "produto": "🧶 SUÉTER", "legenda": "🧶 Suéter feminino de malha lisa e macia\n#lookfeminino #roupafeminina #comprinhas #sueter #blusa"}, {"secao": "Reserva", "produto": "👚 BABY TEE", "legenda": "👚 Blusinha baby tee feminina no kit com três\n#lookfeminino #roupafeminina #comprinhas #blusinha #babytee"}, {"secao": "Reserva", "produto": "🏃‍♀️ CONJUNTO DE ACADEMIA", "legenda": "🏃‍♀️ Conjunto de academia feminino com top de bojo\n#lookfeminino #roupafeminina #conjuntofeminino #roupadeacademia #modafitness"}, {"secao": "Reserva", "produto": "🎽 REGATA ARARA", "legenda": "🎽 Regata feminina de poliamida com forro que dispensa sutiã\n#lookfeminino #roupafeminina #comprinhas #regata #basicos"}, {"secao": "Reserva", "produto": "🧥 JAQUETA ARARA", "legenda": "🧥 Jaqueta de treino feminina com quatro bolsos e protetor de zíper #lookfeminino #roupafeminina #jaqueta #roupadeacademia #modafitness"}, {"secao": "Reserva", "produto": "👗 VESTIDO LONGO DE ALGODÃO", "legenda": "👗 Vestido longo de algodão com bolsos laterais\n#lookfeminino #roupafeminina #comprinhas #vestidolongo #vestido"}, {"secao": "Reserva", "produto": "👗 VESTIDO CURTINHO", "legenda": "👗 Vestido curtinho de algodão com bolsos laterais\n#lookfeminino #roupafeminina #comprinhas #vestidocurto #vestido"}];
const ATUALIZADO = "05/10/2026";
const SECOES = ["Na grade", "Na fila", "Fora do diário", "Reserva"];
const lista = document.getElementById("lista"), busca = document.getElementById("busca"), chips = document.getElementById("chips");
let filtro = "Na grade";
try { filtro = localStorage.getItem("secao") || filtro; } catch (e) {}

function norm(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

function desenharChips() {
  chips.innerHTML = "";
  ["Todas", ...SECOES].forEach(nome => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = nome; b.setAttribute("aria-pressed", String(nome === filtro));
    b.onclick = () => { filtro = nome; try { localStorage.setItem("secao", nome); } catch (e) {} desenharChips(); desenhar(); };
    chips.appendChild(b);
  });
}

function copiar(texto) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto).catch(() => copiarAntigo(texto));
  return copiarAntigo(texto);
}

function copiarAntigo(texto) {
  return new Promise((ok, erro) => {
    const t = document.createElement("textarea");
    t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, texto.length);
    const deu = document.execCommand("copy"); document.body.removeChild(t); deu ? ok() : erro();
  });
}

let timer;
function avisar(msg, erro) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.toggle("erro", !!erro); el.classList.add("on");
  clearTimeout(timer); timer = setTimeout(() => el.classList.remove("on"), 1600);
}

function cartao(item) {
  const b = document.createElement("button");
  b.className = "card";
  b.innerHTML = '<div class="top"><span class="nome"></span><span class="copiar">Copiar</span></div><div class="texto"></div>';
  b.querySelector(".nome").textContent = item.produto;
  b.querySelector(".texto").textContent = item.legenda;
  b.onclick = () => copiar(item.legenda).then(() => {
    document.querySelectorAll(".card.ok").forEach(c => { c.classList.remove("ok"); c.querySelector(".copiar").textContent = "Copiar"; });
    b.classList.add("ok"); b.querySelector(".copiar").textContent = "Copiado ✓";
    if (navigator.vibrate) navigator.vibrate(30);
    avisar("Copiado ✅ " + item.produto);
  }).catch(() => avisar("Não consegui copiar 😕 tenta de novo", true));
  return b;
}

function desenhar() {
  const q = norm(busca.value.trim());
  lista.innerHTML = "";
  let total = 0;
  SECOES.forEach(sec => {
    if (filtro !== "Todas" && filtro !== sec && !q) return;
    const itens = DADOS.filter(d => d.secao === sec && (!q || norm(d.produto + " " + d.legenda).includes(q)));
    if (!itens.length) return;
    const h = document.createElement("h2"); h.textContent = sec + " · " + itens.length; lista.appendChild(h);
    itens.forEach(i => lista.appendChild(cartao(i))); total += itens.length;
  });
  if (!total) lista.innerHTML = '<p class="vazio">Nenhum produto com esse nome 🤔</p>';
  const f = document.createElement("footer");
  f.textContent = "Atualizado em " + ATUALIZADO + " · fonte: LEGENDAS FIXAS POR PRODUTO";
  lista.appendChild(f);
}

busca.addEventListener("input", desenhar);
desenharChips(); desenhar();
</script>
</body>
</html>
